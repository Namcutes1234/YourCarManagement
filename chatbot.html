<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourCarManagement - AI chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; display: flex; flex-direction: column; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .content-wrapper { flex: 1 0 auto; padding: 20px 0; }
        .custom-nav .nav-link:hover {
            color: #ffc107 !important;
            transform: translateY(-1px);
        }
        .custom-nav i {
            font-size: 14px;
        }
        .navbar-brand { font-size: 1.2rem !important; }
        .chat-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; background: #fff; max-width: 900px; margin: auto; }
        #chat-content { 
            height: 500px; overflow-y: auto; background: #ffffff; padding: 25px;
            display: flex; flex-direction: column; gap: 20px; border-bottom: 1px solid #f0f0f0;
        }
        #chat-content::-webkit-scrollbar { width: 6px; }
        #chat-content::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 10px; }
        .user-msg-wrapper { align-self: flex-end; max-width: 80%; }
        .user-msg { 
            background: #0d6efd; color: white; border-radius: 18px 18px 2px 18px; 
            padding: 12px 18px; font-size: 14px; line-height: 1.5; box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }
        .bot-msg-wrapper { align-self: flex-start; max-width: 85%; }
        .bot-msg { 
            background: #f8f9fa; color: #333; border-radius: 18px 18px 18px 2px; 
            padding: 12px 18px; font-size: 14px; line-height: 1.6; border: 1px solid #eef0f2;
        }
        .bot-name { font-size: 11px; font-weight: 700; color: #0d6efd; text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; }
        .chat-input-area { padding: 20px; background: #fff; }
        .input-group-custom { 
            background: #f1f3f4; border-radius: 30px; padding: 8px 10px 8px 25px; display: flex; align-items: center; 
        }
        #chat-input { border: none; background: transparent; flex: 1; outline: none; font-size: 14px; }
        
        .btn-send { 
            background: #0d6efd; color: white; border-radius: 50%; width: 45px; height: 45px; 
            display: flex; align-items: center; justify-content: center; border: none; transition: 0.3s;
        }
        .btn-send:hover { transform: scale(1.05); background: #0056b3; }

        footer { font-size: 11px; color: #6c757d; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fas fa-car-side me-2"></i>YourCarManagement
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="width: 1.2rem; height: 1.2rem;"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center custom-nav">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="home.html"><i class="fas fa-home me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="list.html"><i class="fas fa-list me-1"></i>Danh sách xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="chatbot.html">
                            <i class="fas fa-robot me-1"></i>AI Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="faq.html"><i class="fas fa-question-circle me-1"></i>FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="about.html"><i class="fas fa-info-circle me-1"></i>Giới thiệu</a>
                    </li>
                    
                    <li class="nav-item ms-lg-3">
                        <button onclick="handleLogout()" class="btn btn-outline-light btn-sm px-3 mt-2 mt-lg-0" style="border-radius: 20px; font-size: 13px;">
                            <i class="fas fa-sign-out-alt me-1"></i>Thoát
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <style>
        /* Layout tổng thể đồng bộ Light Mode */
        .chat-layout {
            display: flex;
            width: 100%;
            background-color: #f0f4f9; /* Màu nền xám nhẹ của Google */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* THANH SIDEBAR TRÁI - Màu trắng tinh tế */
        .chat-sidebar {
            width: 280px;
            background-color: #ffffff;
            color: #1f1f1f;
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            border-right: 1px solid #e0e0e0;
        }
        
        /* Nút cuộc trò chuyện mới nhẹ nhàng, bo góc nhẹ hợp với card */
        .sidebar-btn-new {
            background: #edf2fa;
            border: none;
            color: #0b57d0;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: left;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: background 0.2s ease;
        }
        .sidebar-btn-new:hover {
            background: #d3e3fd;
        }
        
        .history-list {
            flex: 1;
            overflow-y: auto;
        }
        
        /* Danh sách các cuộc trò chuyện dạng thanh phẳng */
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #444746;
            transition: all 0.2s ease;
        }
        .history-item:hover {
            background-color: #f0f4f9;
            color: #1f1f1f;
        }
        .history-item.active {
            background-color: #c2e7ff;
            color: #001d35;
            font-weight: 500;
        }
        .history-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .btn-delete-session {
            background: none;
            border: none;
            color: #727477;
            cursor: pointer;
            opacity: 0;
            padding: 2px 6px;
            transition: opacity 0.2s, color 0.2s;
        }
        .history-item:hover .btn-delete-session {
            opacity: 1;
        }
        .btn-delete-session:hover {
            color: #dc3545 !important;
        }

        /* KHUNG CHAT CHÍNH BÊN PHẢI */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #ffffff;
        }

        .chat-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        
        /* Header bỏ viền thô, giữ màu trắng đồng bộ */
        .chat-main .bg-light {
            background-color: #ffffff !important;
            border-bottom: 1px solid #e0e0e0 !important;
            padding: 16px 24px !important;
        }
        
        /* Vùng nội dung tin nhắn tự co giãn rộng rãi */
        #chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
        }
        
        /* Định dạng bong bóng chat */
        .user-msg-wrapper, .bot-msg-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 16px auto;
        }
        .user-msg, .bot-msg {
            border-radius: 14px !important;
            padding: 12px 16px !important;
            max-width: 80%;
            font-size: 15px;
            line-height: 1.5;
            display: inline-block;
        }
        .user-msg {
            background-color: #e9eef6 !important;
            color: #1f1f1f;
            float: right; /* Đẩy tin nhắn user sang phải cho đúng chuẩn */
        }
        .bot-msg {
            background-color: transparent !important;
            box-shadow: none !important;
            padding-left: 0 !important;
            color: #1f1f1f;
        }

        /* KHUNG NHẬP LIỆU RỘNG RÃI */
        .chat-input-area {
            padding: 16px 20px 24px 20px;
            background: #ffffff;
            display: flex;
            justify-content: center;
        }
        .input-group-custom {
            background: #f0f4f9;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            padding: 4px 8px 4px 20px;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }
        #chat-input {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 10px 0;
            color: #1f1f1f;
            font-size: 15px;
            flex: 1;
        }
        .btn-send {
            background: transparent !important;
            border: none !important;
            color: #0b57d0 !important;
            width: 40px;
            height: 40px;
            border-radius: 50% !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-send:hover {
            background: #e1e9f7 !important;
        }
        
        footer {
            background: #ffffff !important;
            color: #757575;
            font-size: 12px;
            border-top: 1px solid #e0e0e0 !important;
        }
    </style>

    <div class="container-fluid p-0 m-0 overflow-hidden" style="height: calc(100vh - 60px);">
        <div class="chat-layout h-100">
            <div class="chat-sidebar">
                <button class="sidebar-btn-new" onclick="startNewSession()">
                    <i class="fas fa-plus"></i> Cuộc trò chuyện mới
                </button>
                <div class="history-list" id="history-list">
                    </div>
            </div>

            <div class="chat-main">
                <div class="chat-card">
                    <div class="bg-white p-3 border-bottom d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; margin-right: 12px;">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div>
                            <h6 class="mb-0 fw-bold">YourCarManagement AI - Trợ lý bảo trì xe</h6>
                            <small class="text-success" style="font-size: 11px;"><i class="fas fa-circle me-1"></i>Đang hoạt động</small>
                        </div>
                    </div>

                    <div id="chat-content">
                        </div>

                    <div class="chat-input-area p-3">
                        <div class="input-group-custom d-flex">
                            <input type="text" id="chat-input" class="form-control" placeholder="Hỏi về lịch thay dầu, đăng kiểm xe...">
                            <button class="btn-send btn" onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 <strong>YourCarManagement</strong>. Toàn bộ dữ liệu được đồng bộ Cloud.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
