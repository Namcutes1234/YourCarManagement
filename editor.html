<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourCarManagement - Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .navbar { padding: 0.8rem 0 !important; }
        .custom-nav .nav-link:hover { color: #ffc107 !important; transform: translateY(-1px); }
        body { background-color: #fff; font-family: 'Segoe UI', sans-serif; color: #333; }
        .main-title { color: #0d6efd; font-weight: 700; text-align: center; margin-top: 20px; text-transform: uppercase; }
        .section-label { font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .form-label { font-size: 14px; margin-bottom: 5px; }
        .form-control, .form-select { border-radius: 6px; border: 1px solid #dee2e6; padding: 8px 12px; font-size: 14px; }
        .img-preview { width: 100%; height: 280px; border: 1px solid #ddd; border-radius: 10px; object-fit: cover; background: #f9f9f9; }
        .btn-save { background-color: #0d6efd; border: none; padding: 10px 40px; border-radius: 6px; font-weight: 600; transition: 0.3s; }
        .btn-cancel { background-color: #f8f9fa; border: 1px solid #ddd; padding: 10px 30px; border-radius: 6px; text-decoration: none; color: #333; }
    </style>
</head>
<body onload="fetchCarDetail()">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fas fa-car-side me-2"></i>YourCarManagement
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="width: 1.2rem; height: 1.2rem;"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center custom-nav">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="home.html"><i class="fas fa-home me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="list.html"><i class="fas fa-list me-1"></i>Danh sách xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="chatbot.html">
                            <i class="fas fa-robot me-1"></i>AI Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="faq.html"><i class="fas fa-question-circle me-1"></i>FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="about.html"><i class="fas fa-info-circle me-1"></i>Giới thiệu</a>
                    </li>
                    
                    <li class="nav-item ms-lg-3">
                        <button onclick="handleLogout()" class="btn btn-outline-light btn-sm px-3 mt-2 mt-lg-0" style="border-radius: 20px; font-size: 13px;">
                            <i class="fas fa-sign-out-alt me-1"></i>Thoát
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3 class="main-title mb-4">QUẢN LÝ HỒ SƠ XE</h3>

        <form id="edit-form">
            <div class="row g-4">
                <div class="col-md-4">
                    <p class="section-label">Hình ảnh đại diện</p>
                    <img id="preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='100%' height='100%' fill='%23e9ecef'/><text x='50%' y='50%' font-family='sans-serif' font-size='16' fill='%236c757d' dominant-baseline='middle' text-anchor='middle'>📸 Chưa có hình ảnh</text></svg>" class="img-preview mb-3" alt="Car Image">
                    <input type="file" id="e-img" class="form-control mb-2" accept="image/*" onchange="previewImg(this)">
                    <p class="text-muted" style="font-size: 11px;">* Nên dùng ảnh dưới 1MB để đảm bảo tốc độ đồng bộ.</p>
                </div>

                <div class="col-md-8">
                    <p class="section-label">Thông tin xe cơ bản</p>
                    <div class="row g-3 mb-4 border-bottom pb-4">
                        <div class="col-md-6">
                            <label class="form-label">Hãng xe</label>
                            <input type="text" id="e-brand" class="form-control" placeholder="Hãng xe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên xe</label>
                            <input type="text" id="e-name" class="form-control" placeholder="Tên xe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Biển số</label>
                            <input type="text" id="e-plate" class="form-control" placeholder="30A-123.45" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nhiên liệu</label>
                            <select id="e-fuel" class="form-select">
                                <option value="Xăng">Xăng</option>
                                <option value="Dầu">Dầu</option>
                                <option value="Điện">Điện</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Số KM hiện tại</label>
                            <input type="number" id="e-km" class="form-control" placeholder="Ví dụ: 55000" required>
                        </div>
                    </div>

                    <p class="section-label">Thông tin người lái xe (Tài xế)</p>
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label">Họ tên tài xế</label>
                            <input type="text" id="e-driver" class="form-control" placeholder="Tên người lái">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hạng bằng</label>
                            <select id="e-license-rank" class="form-select">
                                <option value="B1">B1</option>
                                <option value="B2">B2</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="FC">FC</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" id="e-phone" class="form-control" placeholder="09xxxxxxxx">
                        </div>
                    </div>
                </div>
                <div class="col-12 mt-4">
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <h6 class="fw-bold text-secondary"><i class="fas fa-note-sticky"></i> Giấy tờ</h6>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-danger">Hạn Đăng kiểm</label>
                            <input type="date" id="e-registry" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-danger">Hạn Bằng lái</label>
                            <input type="date" id="e-license-expiry" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-danger">Bảo hiểm vật chất xe</label>
                            <input type="date" id="e-insurance-vatchat" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-danger">Bảo hiểm bắt buộc (TNDS)</label>
                            <input type="date" id="e-insurance-batbuoc" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-danger">Hạn Đăng kí</label>
                            <input type="date" id="e-dangky" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-danger">Hạn giấy đi đường Ngân Hàng</label>
                            <input type="date" id="e-giay-nganhang" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="col-12 mt-4">
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <h6 class="fw-bold text-secondary"><i class="fas fa-tools me-2"></i> Bảo trì / Bảo dưỡng</h6>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-warning">Hạn Thay dầu</label>
                            <input type="date" id="e-oil" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-warning">Hạn Lọc gió/nhớt</label>
                            <input type="date" id="e-filter" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-warning">Hạn Đảo lốp</label>
                            <input type="date" id="e-tire" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-warning">Bảo dưỡng phanh</label>
                            <input type="date" id="e-brake" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-warning">Vệ sinh máy lạnh</label>
                            <input type="date" id="e-aircon" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="row g-3 mb-4 pt-3 border-top">
                <div class="col-12">
                    <h6 class="fw-bold text-secondary"><i class="fas fa-sliders-h me-2"></i>Hạng mục tùy chỉnh thêm</h6>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 bg-light border-0 dynamic-item">
                        <label class="form-label small fw-semibold text-primary">Hạng mục tự chọn 1</label>
                        <input type="text" id="custom1_label" class="form-control mb-2" placeholder="Ví dụ: Thay bình ắc quy, Gia hạn định vị...">
                        <input type="date" id="custom1_date" class="form-control">
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 bg-light border-0 dynamic-item">
                        <label class="form-label small fw-semibold text-primary">Hạng mục tự chọn 2</label>
                        <input type="text" id="custom2_label" class="form-control mb-2" placeholder="Ví dụ: Rửa khoang máy...">
                        <input type="date" id="custom2_date" class="form-control">
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 bg-light border-0 dynamic-item">
                        <label class="form-label small fw-semibold text-primary">Hạng mục tự chọn 3</label>
                        <input type="text" id="custom3_label" class="form-control mb-2" placeholder="Ví dụ: Thay gạt mưa...">
                        <input type="date" id="custom3_date" class="form-control">
                    </div>
                </div>
            </div>
                <div class="col-12">
                    <label class="form-label">Ghi chú thêm</label>
                    <textarea id="e-note" class="form-control" rows="3" placeholder="Nhập các lưu ý về tình trạng xe..."></textarea>
                </div>

                <div class="col-12 mt-5 mb-5">
                    <button type="submit" class="btn btn-primary btn-save text-white me-2 shadow-sm">LƯU DỮ LIỆU</button>
                    <a href="list.html" class="btn btn-cancel shadow-sm">Hủy bỏ</a>
                </div>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        const user = checkAuth();
        const carId = new URLSearchParams(window.location.search).get('id');
        
        // 1. Logic ĐỔ DỮ LIỆU
    async function fetchCarDetail() {
        if (!carId) return;
        try {
            const res = await fetch(getUrl(`users/${user}/cars/${carId}`));
            const c = await res.json();
            if (!c) return;

            // Đối tượng chứa dữ liệu để đối chiếu
            const map = {
                'e-brand': c.brand, 'e-name': c.name, 'e-plate': c.plate, 'e-fuel': c.fuel,
                'e-km': c.km, 'e-driver': c.driver, 'e-license-rank': c.licenseRank,
                'e-phone': c.phone, 'e-registry': c.registry, 'e-license-expiry': c.licenseExpiry,
                'e-insurance-vatchat': c.insuranceVatchat, 'e-insurance-batbuoc': c.insuranceBatbuoc,
                'e-dangky': c.dangky,'e-giay-nganhang': c.giayNganhang,
                'e-oil': c.oil, 'e-filter': c.filter, 'e-tire': c.tire, 'e-brake': c.brake,
                'e-aircon': c.aircon, 'custom1_label': c.custom1_label, 'custom1_date': c.custom1_date,
                'custom2_label': c.custom2_label, 'custom2_date': c.custom2_date,
                'custom3_label': c.custom3_label, 'custom3_date': c.custom3_date, 'e-note': c.note
            };

            // VÒNG LẶP ĐỔ DỮ LIỆU VÀO CÁC Ô INPUT
            for (let id in map) {
                const el = document.getElementById(id);
                if (el) {
                    el.value = map[id] || ''; // Gán giá trị hoặc để trống nếu không có dữ liệu
                }
            }

            // Cập nhật ảnh đại diện nếu có
            if (c.img) {
                document.getElementById('preview').src = c.img;
            }

        } catch (err) { 
            console.error("Lỗi khi tải dữ liệu từ Firebase:", err); 
        }
    }
        function handleSelectChange(selectElement, inputId) {
            const inputField = document.getElementById(inputId);
            if (!inputField) return;

            if (selectElement.value === "other") {
                inputField.classList.remove('d-none');
                inputField.value = "";
                inputField.focus();
            } else {
                inputField.classList.add('d-none');
                inputField.value = selectElement.value;
            }
        }
        // 2. Logic LƯU DỮ LIỆU
        document.getElementById('edit-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                brand: document.getElementById('e-brand').value,
                name: document.getElementById('e-name').value,
                plate: document.getElementById('e-plate').value,
                fuel: document.getElementById('e-fuel').value,
                km: document.getElementById('e-km').value,
                driver: document.getElementById('e-driver').value,
                licenseRank: document.getElementById('e-license-rank').value,
                phone: document.getElementById('e-phone').value,
                registry: document.getElementById('e-registry').value,
                licenseExpiry: document.getElementById('e-license-expiry').value,
                insuranceVatchat: document.getElementById('e-insurance-vatchat').value,
                insuranceBatbuoc: document.getElementById('e-insurance-batbuoc').value,
                dangky: document.getElementById('e-dangky').value,
                giayNganhang: document.getElementById('e-giay-nganhang').value,
                oil: document.getElementById('e-oil').value,
                filter: document.getElementById('e-filter').value,
                tire: document.getElementById('e-tire').value,
                brake: document.getElementById('e-brake').value,
                aircon: document.getElementById('e-aircon').value,
                custom1_label: document.getElementById('custom1_label').value,
                custom1_date: document.getElementById('custom1_date').value,
                custom2_label: document.getElementById('custom2_label').value,
                custom2_date: document.getElementById('custom2_date').value,
                custom3_label: document.getElementById('custom3_label').value,
                custom3_date: document.getElementById('custom3_date').value,
                note: document.getElementById('e-note').value,
                img: document.getElementById('preview').src
            };

            try {
                await fetch(getUrl(`users/${user}/cars/${carId}`), {
                    method: 'PATCH',
                    body: JSON.stringify(data)
                });
                alert("Cập nhật thành công!");
                window.location.href = 'list.html';
            } catch (err) { alert("Lỗi lưu!"); }
        };
    </script>
</body>
</html>
