<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourCarManagement - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .navbar {
            padding: 0.8rem 0 !important;
        }
        .custom-nav .nav-link:hover {
            color: #ffc107 !important;
            transform: translateY(-1px);
        }
        .custom-nav i {
            font-size: 14px;
        }
        /* Cấu trúc Flexbox giúp Footer luôn bám chắc ở đáy màn hình */
        body { 
            background-color: #f4f7f6; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
        }
        .content-wrapper { 
            flex: 1 0 auto; 
            padding: 40px 0; 
        }
        .stat-card { border: none; border-radius: 15px; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .action-btn { border-radius: 12px; padding: 15px; border: 1.5px solid #eee; background: #fff; transition: 0.3s; text-decoration: none; color: #333; display: block; }
        .action-btn:hover { border-color: #0d6efd; background: #f0f7ff; color: #0d6efd; }
        .navbar-brand { font-size: 1.2rem !important; }
        footer { font-size: 11px; flex-shrink: 0; color: #6c757d; }
        .alert-container { border-radius: 15px; overflow: hidden; }
    </style>
</head>
<body onload="initDashboard()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fas fa-car-side me-2"></i>YourCarManagement
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="width: 1.2rem; height: 1.2rem;"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center custom-nav">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="home.html"><i class="fas fa-home me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="list.html"><i class="fas fa-list me-1"></i>Danh sách xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="chatbot.html">
                            <i class="fas fa-robot me-1"></i>AI Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="faq.html"><i class="fas fa-question-circle me-1"></i>FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="about.html"><i class="fas fa-info-circle me-1"></i>Giới thiệu</a>
                    </li>
                    
                    <li class="nav-item ms-lg-3">
                        <button onclick="handleLogout()" class="btn btn-outline-light btn-sm px-3 mt-2 mt-lg-0" style="border-radius: 20px; font-size: 13px;">
                            <i class="fas fa-sign-out-alt me-1"></i>Thoát
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- KHU VỰC NỘI DUNG CHÍNH -->
    <div class="content-wrapper">
        <div class="container">
            <div class="mb-4">
                <h4 class="fw-bold mb-1">Hệ thống điều khiển</h4>
                <p class="text-secondary small">Chào mừng quay trở lại, đây là trạng thái đội xe của bạn.</p>
            </div>
            
            <div class="row mb-5">
                <!-- Card Tổng số xe -->
                <div class="col-md-6 mb-3">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-primary text-white me-3"><i class="fas fa-car"></i></div>
                            <div>
                                <h6 class="text-muted small mb-0">Tổng số xe</h6>
                                <h4 class="fw-bold mb-0" id="total-cars">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Card Cần xử lý (Hiển thị số xe thực tế gặp vấn đề hạn định) -->
                <div class="col-md-6 mb-3">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-warning text-white me-3"><i class="fas fa-shield-alt"></i></div>
                            <div>
                                <h6 class="text-muted small mb-0">Cần xử lý</h6>
                                <h4 class="fw-bold mb-0" id="need-service">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Vùng hiển thị Alert nhắc nhở lịch đăng kiểm / bảo hiểm -->
            <div id="alert-box-container" class="mb-4 alert-container"></div>
        </div>
    </div>
    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 <strong>YourCarManagement</strong>. Toàn bộ dữ liệu được đồng bộ Cloud.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const user = checkAuth();
        
        // Hàm tính số ngày còn lại kể từ ngày hôm nay (YYYY-MM-DD)
        function calculateDaysLeft(targetDateStr) {
            if (!targetDateStr) return null;
            const today = new Date();
            const targetDate = new Date(targetDateStr);
            
            today.setHours(0,0,0,0);
            targetDate.setHours(0,0,0,0);

            const timeDiff = targetDate.getTime() - today.getTime();
            return Math.ceil(timeDiff / (1000 * 3600 * 24));
        }

        async function initDashboard() {
            try {
                const res = await fetch(getUrl(`users/${user}/cars`));
                const data = await res.json();

                if (!data) return;

                const carsArray = Object.values(data);
                document.getElementById('total-cars').innerText = carsArray.length;

                // CẤU HÌNH CÁC MỤC QUÉT ALERT
                const alertConfigs = [
                    { key: 'registry', label: 'Hạn đăng kiểm', threshold: 15 },
                    { key: 'licenseExpiry', label: 'Hạn bằng lái', threshold: 30 },
                    { key: 'insuranceVatchat', label: 'Bảo hiểm vật chất xe', threshold: 15 },
                    { key: 'insuranceBatbuoc', label: 'Bảo hiểm bắt buộc (TNDS)', threshold: 15 },
                    { key: 'dangky', label: 'Hạn đăng kí', threshold: 15 }, // Sửa: dangky
                    { key: 'giayNganhang', label: 'Hạn giấy đi đường Ngân Hàng', threshold: 15 }, // Sửa: giayNganhang
                    { key: 'oil', label: 'Hạn thay dầu', threshold: 15 },
                    { key: 'filter', label: 'Hạn lọc gió/nhớt', threshold: 15 },
                    { key: 'tire', label: 'Bảo dưỡng củ đề máy pháp', threshold: 15 },
                    { key: 'brake', label: 'Bảo dưỡng phanh', threshold: 15 },
                    { key: 'aircon', label: 'Vệ sinh máy lạnh', threshold: 15 },
                    { key: 'bommo', label: 'Hạn bơm mỡ', threshold: 15 },
                    { key: 'custom1', label: 'Tùy chỉnh 1', isCustom: true, threshold: 15 },
                    { key: 'custom2', label: 'Tùy chỉnh 2', isCustom: true, threshold: 15 },
                    { key: 'custom3', label: 'Tùy chỉnh 3', isCustom: true, threshold: 15 }
                ];
                const alertContainer = document.getElementById('alert-box-container');
                alertContainer.innerHTML = ''; // Xóa thông báo cũ trước khi render mới

                let needServiceCars = new Set();
                let allAlerts = []; // Mảng tạm thời để chứa tất cả thông báo trước khi sắp xếp

                // Duyệt qua từng xe trong hệ thống
                carsArray.forEach(car => {
                    const carName = `${car.brand || ''} ${car.name || ''} (${car.plate || 'Chưa có biển'})`;
                    const carId = car.plate || car.name || Math.random().toString();

                    // Duyệt qua từng mục ngày hạn để kiểm tra
                    alertConfigs.forEach(config => {
                        let dateValue = "";
                        let labelText = config.label;

                        // Kiểm tra xem mục đang quét là mục cố định hay mục tự gõ (Custom)
                        if (config.isCustom) {
                            // Lấy tên nhãn do người dùng tự gõ (ví dụ: car["custom1_label"])
                            const customLabel = car[`${config.key}_label`];
                            // Lấy ngày do người dùng chọn
                            dateValue = car[`${config.key}_date`];
                            
                            if (customLabel && dateValue) {
                                labelText = customLabel; // Đổi chữ "Tùy chỉnh 1" thành tên người dùng tự gõ
                            } else {
                                return; // Nếu ô này trống (người dùng không nhập) thì bỏ qua không quét
                            }
                        } else {
                            // Đối với các mục mặc định hệ thống (đăng kiểm, bảo hiểm...)
                            dateValue = car[config.key];
                        }
                        
                        // Tiến hành tính toán ngày hạn nếu có dữ liệu ngày
                        if (dateValue) {
                            const daysLeft = calculateDaysLeft(dateValue);
                            
                            // Ngưỡng báo tối đa: Hạn bằng lái là 30 ngày, các mục khác (kể cả tự gõ) là 15 ngày
                            const maxThreshold = (config.key === 'licenseExpiry') ? 30 : 15;

                            if (daysLeft <= maxThreshold) {
                                let alertClass = "";
                                let priority = 3; 

                                // Phân chia màu sắc theo số ngày còn lại
                                if (daysLeft <= 1) {
                                    alertClass = "alert-danger";  // Đỏ
                                    priority = 1;
                                    needServiceCars.add(carId); 
                                } else if (daysLeft <= 7) {
                                    alertClass = "alert-warning"; // Vàng
                                    priority = 2;
                                    needServiceCars.add(carId);
                                } else {
                                    alertClass = "alert-success"; // Xanh
                                    priority = 3;
                                    needServiceCars.add(carId);
                                }

                                // Định dạng chuỗi văn bản hiển thị ra giao diện
                                let alertText = "";
                                if (daysLeft > 0) {
                                    alertText = `Xe <strong>${carName}</strong>: Mục <strong>${labelText}</strong> còn <strong>${daysLeft} ngày</strong> (${dateValue}).`;
                                } else if (daysLeft === 0) {
                                    alertText = `Xe <strong>${carName}</strong>: Mục <strong>${labelText}</strong> <strong>đến hạn hôm nay!</strong> (${dateValue}).`;
                                } else {
                                    alertText = `Xe <strong>${carName}</strong>: Mục <strong>${labelText}</strong> đã <span class="badge bg-danger">quá hạn ${Math.abs(daysLeft)} ngày</span> (${dateValue}).`;
                                }

                                let iconClass = "fa-info-circle";
                                if (priority === 1) iconClass = "fa-exclamation-triangle";
                                if (priority === 2) iconClass = "fa-exclamation-circle";

                                allAlerts.push({
                                    priority: priority,
                                    html: `
                                        <div class="alert ${alertClass} alert-dismissible fade show mb-2 shadow-sm" role="alert" style="border-radius: 10px;">
                                            <i class="fas ${iconClass} me-2"></i> ${alertText}
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                        </div>
                                    `
                                });
                            }
                        }
                    });
                });

                // THỰC HIỆN SẮP XẾP: Thứ tự ưu tiên tăng dần (Đỏ 1 -> Vàng 2 -> Xanh 3)
                allAlerts.sort((a, b) => a.priority - b.priority);

                // Tiến hành render chuỗi HTML đã sắp xếp gọn gàng ra giao diện
                allAlerts.forEach(alert => {
                    alertContainer.innerHTML += alert.html;
                });

                // Nếu không có cảnh báo nào, hiện thông báo trống cho đẹp mắt
                if (allAlerts.length === 0) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-light text-center border shadow-sm" style="border-radius: 10px;">
                            <i class="fas fa-check-circle text-success me-2"></i> Mọi thứ đều tuyệt vời! Không có hạng mục nào cần xử lý.
                        </div>
                    `;
                }

                // Cập nhật số lượng xe cần xử lý thực tế lên ô Thống kê (chính là size của Set)
                document.getElementById('need-service').innerText = needServiceCars.size;

            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
