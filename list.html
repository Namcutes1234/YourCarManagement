<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YourCarManagement - List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .navbar { padding: 0.8rem 0 !important; }
        .custom-nav .nav-link:hover { color: #ffc107 !important; transform: translateY(-1px); }
        body { background-color: #fff; font-family: 'Segoe UI', sans-serif; color: #333; }
        .main-title { color: #0d6efd; font-weight: 700; text-align: center; margin-top: 20px; text-transform: uppercase; }
        .section-label { font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 500; }
        .form-label { font-size: 14px; margin-bottom: 5px; }
        .form-control, .form-select { border-radius: 6px; border: 1px solid #dee2e6; padding: 8px 12px; font-size: 14px; }
        .img-preview { width: 100%; height: 280px; border: 1px solid #ddd; border-radius: 10px; object-fit: cover; background: #f9f9f9; }
        .btn-save { background-color: #0d6efd; border: none; padding: 10px 40px; border-radius: 6px; font-weight: 600; transition: 0.3s; }
        .btn-cancel { background-color: #f8f9fa; border: 1px solid #ddd; padding: 10px 30px; border-radius: 6px; text-decoration: none; color: #333; }
        .car-actions { display: flex; gap: 8px; margin-top: 10px; }
        .list-group-item { border-left: 4px solid #0d6efd; }
        .car-card-img { width: 100%; height: 160px; object-fit: cover; border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .car-type-badge { font-size: 13px; padding: 5px 10px; border-radius: 20px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
        .history-change-item {
            word-break: break-all;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        .history-img-text {
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: 12px;
            color: #dc3545;
            background: #f8f9fa;
            padding: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body onload="loadCars()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fas fa-car-side me-2"></i>YourCarManagement
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="width: 1.2rem; height: 1.2rem;"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center custom-nav">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="home.html"><i class="fas fa-home me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="list.html"><i class="fas fa-list me-1"></i>Danh sách xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="chatbot.html">
                            <i class="fas fa-robot me-1"></i>AI Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="faq.html"><i class="fas fa-question-circle me-1"></i>FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="about.html"><i class="fas fa-info-circle me-1"></i>Giới thiệu</a>
                    </li>
                    
                    <li class="nav-item ms-lg-3">
                        <button onclick="handleLogout()" class="btn btn-outline-light btn-sm px-3 mt-2 mt-lg-0" style="border-radius: 20px; font-size: 13px;">
                            <i class="fas fa-sign-out-alt me-1"></i>Thoát
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="fas fa-list-ul me-2 text-primary"></i>Danh sách xe của tôi</h4>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Thêm xe mới</button>
        </div>

        <!-- Thanh tìm kiếm thông minh -->
        <div class="input-group mb-4 shadow-sm" style="border-radius: 8px; overflow: hidden;">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-search"></i></span>
            <input type="text" id="search-input" class="form-control border-start-0 ps-0" placeholder="Nhập từ khóa tìm kiếm (tên xe, hãng, biển số, loại xe)..." onkeyup="filterCars()">
        </div>

        <div id="car-list" class="row"></div>
    </div>

    <!-- Modal Lịch sử -->
    <div class="modal fade" id="historyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nhật ký thay đổi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="history-content">Đang tải...</div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm xe -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-body">
            <h5 class="mb-3"><i class="fas fa-plus me-2 text-primary"></i>Thêm xe mới</h5>
            
            <label class="form-label small fw-semibold">Loại xe</label>
            <select id="t" class="form-select mb-2" onchange="handleAddTypeChange(this)">
                <option value="Ô tô">Ô tô</option>
                <option value="Xe máy">Xe máy</option>
                <option value="Xe máy điện">Xe máy điện</option>
                <option value="Xe khách">Xe khách</option>
                <option value="Xe tải">Xe tải</option>
                <option value="Khác">Khác (Tự nhập)</option>
            </select>
            <!-- Ô nhập phụ xuất hiện khi chọn Khác -->
            <input type="text" id="t-custom" class="form-control mb-2 d-none" placeholder="Nhập loại xe tùy chỉnh (VD: xe ben)...">

            <label class="form-label small fw-semibold">Hãng xe</label>
            <input type="text" id="b" class="form-control mb-2" placeholder="Hãng xe">

            <label class="form-label small fw-semibold">Tên xe</label>
            <input type="text" id="n" class="form-control mb-2" placeholder="Tên xe">

            <label class="form-label small fw-semibold">Biển số</label>
            <input type="text" id="p" class="form-control mb-2" placeholder="Biển số">

            <button onclick="addCar()" class="btn btn-primary w-100 mt-2">Đồng bộ lên Cloud</button>
        </div></div></div>
    </div>

    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 <strong>YourCarManagement</strong>. Toàn bộ dữ liệu được đồng bộ Cloud.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        const user = checkAuth();
        let historyModalInstance = null;
        let allCarsData = {}; // Biến toàn cục lưu trữ danh sách xe để phục vụ tìm kiếm

        function handleAddTypeChange(selectEl) {
            const customInput = document.getElementById('t-custom');
            if (selectEl.value === 'Khác') {
                customInput.classList.remove('d-none');
                customInput.focus();
            } else {
                customInput.classList.add('d-none');
                customInput.value = '';
            }
        }

        function getCarIcon(type) {
            if (!type) return '<i class="fas fa-car"></i>';
            const t = type.toLowerCase();
            if (t.includes('ô tô') || t.includes('oto') || t.includes('xe hơi')) return '<i class="fas fa-car"></i>';
            if (t.includes('xe máy điện') || t.includes('máy điện')) return '<i class="fas fa-bolt"></i>';
            if (t.includes('xe máy') || t.includes('motor') || t.includes('mô tô') || t.includes('wave') || t.includes('exciter')) return '<i class="fas fa-motorcycle"></i>';
            if (t.includes('xe khách') || t.includes('bus') || t.includes('xe buýt')) return '<i class="fas fa-bus"></i>';
            if (t.includes('xe tải') || t.includes('truck')) return '<i class="fas fa-truck"></i>';
            if (t.includes('xe ben') || t.includes('ben')) return '<i class="fas fa-dumpster"></i>';
            return '<i class="fas fa-car-side"></i>';
        }

        async function loadCars() {
            try {
                const res = await fetch(getUrl(`users/${user}/cars`));
                allCarsData = await res.json();
                renderCarList(allCarsData);
            } catch (err) {
                console.error(err);
                document.getElementById('car-list').innerHTML = "<p class='text-center text-danger'>Lỗi khi tải dữ liệu xe.</p>";
            }
        }

        // Thuật toán hiển thị danh sách xe ra HTML
        function renderCarList(data) {
            const list = document.getElementById('car-list');
            if (!data || Object.keys(data).length === 0) {
                list.innerHTML = "<p class='text-center text-muted'>Chưa có xe nào...</p>";
                return;
            }
            
            const defaultImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200' viewBox='0 0 400 200'><rect width='100%' height='100%' fill='%23e9ecef'/><text x='50%' y='50%' font-family='sans-serif' font-size='16' fill='%236c757d' dominant-baseline='middle' text-anchor='middle'>📸 Chưa có hình ảnh</text></svg>";

            list.innerHTML = '';
            Object.entries(data).forEach(([id, c]) => {
                const imgUrl = c.img || defaultImg;
                const iconHtml = getCarIcon(c.type);
                const carType = c.type ? `<span class="badge bg-info text-dark ms-2 car-type-badge">${iconHtml} ${c.type}</span>` : '';

                list.innerHTML += `
                    <div class="col-md-4 mb-4 car-item-card">
                        <div class="card shadow-sm border-0 h-100">
                            <img src="${imgUrl}" class="car-card-img" alt="${c.name || 'Xe'}">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <h6 class="fw-bold text-primary mb-0">${c.brand || ''} ${c.name || ''}</h6>
                                        ${carType}
                                    </div>
                                    <p class="form-label small fw-bold text-danger mb-2">Biển: ${c.plate || 'N/A'}</p>
                                </div>
                                <div class="car-actions">
                                    <button class="btn btn-sm btn-outline-info py-0" onclick="showHistory('${id}')" title="Nhật ký thay đổi"><i class="fas fa-history"></i></button>
                                    <button class="btn btn-sm btn-outline-success py-0" onclick="exportFullCarData('${id}')" title="Xuất toàn bộ thông tin"><i class="fas fa-file-export"></i></button>
                                    <a href="editor.html?id=${id}" class="btn btn-sm btn-outline-warning py-0">Sửa</a>
                                    <button class="btn btn-sm btn-outline-danger py-0" onclick="del('${id}')">Xóa</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // Thuật toán lọc tìm kiếm theo từ khóa
        function filterCars() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            if (!allCarsData) return;

            const filtered = {};
            Object.entries(allCarsData).forEach(([id, c]) => {
                const brand = (c.brand || '').toLowerCase();
                const name = (c.name || '').toLowerCase();
                const plate = (c.plate || '').toLowerCase();
                const type = (c.type || '').toLowerCase();
                const note = (c.note || '').toLowerCase();

                // Kiểm tra xem từ khóa có khớp với bất kỳ thông tin nào của xe không
                if (brand.includes(keyword) || name.includes(keyword) || plate.includes(keyword) || type.includes(keyword) || note.includes(keyword)) {
                    filtered[id] = c;
                }
            });

            const list = document.getElementById('car-list');
            if (Object.keys(filtered).length === 0) {
                list.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="text-muted fs-5"><i class="fas fa-search me-2"></i>Không tìm thấy mục nào</div>
                    </div>`;
            } else {
                renderCarList(filtered);
            }
        }

        async function showHistory(carId) {
            const modalEl = document.getElementById('historyModal');
            if (!historyModalInstance) {
                historyModalInstance = new bootstrap.Modal(modalEl);
            }
            
            const content = document.getElementById('history-content');
            content.innerHTML = "Đang tải...";
            historyModalInstance.show();

            try {
                const res = await fetch(getUrl(`users/${user}/cars/${carId}/history`));
                const historyData = await res.json();
                
                if (!historyData) {
                    content.innerHTML = "<p class='text-muted'>Chưa có lịch sử thay đổi.</p>";
                    return;
                }

                const historyList = Object.entries(historyData).reverse();
                let html = '<div class="list-group">';
                
                historyList.forEach(([timestamp, changes]) => {
                    const time = new Date(parseInt(timestamp)).toLocaleString('vi-VN');
                    
                    let changesHtml = '';
                    for (let key in changes) {
                        if (changes[key].old !== changes[key].new) {
                            let oldVal = changes[key].old || 'Trống';
                            let newVal = changes[key].new;
                            if (key.toLowerCase() === 'img') {
                                oldVal = oldVal.length > 50 ? '[Dữ liệu ảnh cũ]' : oldVal;
                                newVal = newVal.length > 50 ? '[Dữ liệu ảnh mới]' : newVal;
                            }
                            changesHtml += `
                                <div class="small border-bottom py-1 history-change-item">
                                    <strong>${key.toUpperCase()}:</strong> 
                                    <span class="text-danger">${oldVal}</span> 
                                    <i class="fas fa-arrow-right mx-1 text-muted"></i> 
                                    <span class="text-success fw-bold">${newVal}</span>
                                </div>`;
                        }
                    }

                    html += `
                        <div class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold text-primary">${time}</span>
                                <div>
                                    <button class="btn btn-sm btn-outline-success py-0 me-2" onclick="exportHistoryToExcel('${carId}')" title="Xuất Excel">
                                        <i class="fas fa-file-excel"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger py-0" onclick="deleteHistoryItem('${carId}', '${timestamp}')">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                            ${changesHtml || '<p class="small text-muted mb-0">Không có thay đổi dữ liệu chi tiết.</p>'}
                        </div>`;
                });
                
                content.innerHTML = html + '</div>';
            } catch (err) {
                content.innerHTML = "<p class='text-danger'>Lỗi khi tải lịch sử.</p>";
            }
        }

        async function deleteHistoryItem(carId, timestamp) {
            if (!confirm("Bạn có chắc chắn muốn xóa bản ghi lịch sử này không?")) return;

            try {
                const res = await fetch(getUrl(`users/${user}/cars/${carId}/history/${timestamp}`), {
                    method: 'DELETE'
                });

                if (res.ok) {
                    alert("Đã xóa bản ghi!");
                    showHistory(carId); 
                } else {
                    throw new Error("Xóa thất bại");
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi khi xóa bản ghi!");
            }
        }

        async function exportHistoryToExcel(carId) {
            try {
                const res = await fetch(getUrl(`users/${user}/cars/${carId}/history`));
                const historyData = await res.json();
                
                if (!historyData) return alert("Không có dữ liệu để xuất!");

                const fieldMap = {
                    'type': 'Loại xe',
                    'brand': 'Hãng xe',
                    'name': 'Tên xe',
                    'plate': 'Biển số',
                    'fuel': 'Nhiên liệu',
                    'driver': 'Tài xế',
                    'license_rank': 'Hạng bằng',
                    'phone': 'SĐT Tài xế',
                    'registry': 'Hạn Đăng kiểm',
                    'license_expiry': 'Hạn Bằng lái',
                    'insurance_vatchat': 'BH Vật chất',
                    'insurance_batbuoc': 'BH TNDS',
                    'dangky': 'Hạn Đăng ký',
                    'giay_nganhang': 'Hạn Giấy ngân hàng',
                    'oil': 'Hạn Thay dầu',
                    'filter': 'Hạn Lọc nhớt',
                    'tire': 'Bảo dưỡng củ đề',
                    'brake': 'Bảo dưỡng phanh',
                    'aircon': 'Vệ sinh máy lạnh',
                    'bommo': 'Bơm mỡ',
                    'custom1_label': 'Hạng mục 1',
                    'custom1_date': 'Ngày hạng mục 1',
                    'custom2_label': 'Hạng mục 2',
                    'custom2_date': 'Ngày hạng mục 2',
                    'custom3_label': 'Hạng mục 3',
                    'custom3_date': 'Ngày hạng mục 3',
                    'note': 'Ghi chú'
                };

                const data = Object.entries(historyData).map(([timestamp, changes]) => {
                    let row = { "Thời gian cập nhật": new Date(parseInt(timestamp)).toLocaleString('vi-VN') };
                    
                    for (let key in changes) {
                        const cleanKey = key.replace('e-', ''); 
                        const displayName = fieldMap[cleanKey] || key.toUpperCase();
                        row[displayName] = `${changes[key].old || 'Trống'} -> ${changes[key].new}`;
                    }
                    return row;
                });

                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "LichSu");
                XLSX.writeFile(wb, `LichSu_${carId}.xlsx`);
            } catch (err) {
                console.error(err);
                alert("Lỗi khi xuất file!");
            }
        }

        async function exportFullCarData(carId) {
            try {
                const res = await fetch(getUrl(`users/${user}/cars/${carId}`));
                const carData = await res.json();
                
                if (!carData) return alert("Không tìm thấy dữ liệu xe!");

                const fieldMap = {
                    'type': 'Loại xe',
                    'brand': 'Hãng xe',
                    'name': 'Tên xe',
                    'plate': 'Biển số',
                    'fuel': 'Nhiên liệu',
                    'driver': 'Tài xế',
                    'licenseRank': 'Hạng bằng',
                    'phone': 'SĐT Tài xế',
                    'registry': 'Hạn Đăng kiểm',
                    'licenseExpiry': 'Hạn Bằng lái',
                    'insuranceVatchat': 'BH Vật chất',
                    'insuranceBatbuoc': 'BH TNDS',
                    'dangky': 'Hạn Đăng ký',
                    'giayNganhang': 'Hạn Giấy ngân hàng',
                    'oil': 'Hạn Thay dầu',
                    'filter': 'Hạn Lọc nhớt',
                    'tire': 'Bảo dưỡng củ đề',
                    'brake': 'Bảo dưỡng phanh',
                    'aircon': 'Vệ sinh máy lạnh',
                    'bommo': 'Bơm mỡ',
                    'custom1_label': 'Nhãn 1',
                    'custom1_date': 'Ngày 1',
                    'custom2_label': 'Nhãn 2',
                    'custom2_date': 'Ngày 2',
                    'custom3_label': 'Nhãn 3',
                    'custom3_date': 'Ngày 3',
                    'note': 'Ghi chú'
                };

                let rows = [];
                for (let key in fieldMap) {
                    if (carData[key] !== undefined) {
                        rows.push({
                            "Thông tin": fieldMap[key],
                            "Giá trị": carData[key]
                        });
                    }
                }

                const ws = XLSX.utils.json_to_sheet(rows);
                ws['!cols'] = [{ wch: 25 }, { wch: 35 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "ThongTinXe");
                
                XLSX.writeFile(wb, `ThongTin_${carData.name || 'Xe'}.xlsx`);
            } catch (err) {
                console.error(err);
                alert("Lỗi khi xuất dữ liệu!");
            }
        }

        // Cơ chế dọn dẹp để chống "đóng băng" giao diện
        document.getElementById('historyModal').addEventListener('hidden.bs.modal', function () {
            document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
            document.body.classList.remove('modal-open');
            document.body.style.overflow = '';
            document.body.style.paddingRight = '';
        });

        async function addCar() {
            const selectVal = document.getElementById('t').value;
            const finalType = selectVal === 'Khác' 
                ? (document.getElementById('t-custom').value.trim() || 'Khác') 
                : selectVal;

            const car = { 
                type: finalType,
                brand: document.getElementById('b').value, 
                name: document.getElementById('n').value, 
                plate: document.getElementById('p').value,
            };
            await fetch(getUrl(`users/${user}/cars`), { method: 'POST', body: JSON.stringify(car) });
            location.reload();
        }

        async function del(id) {
            if(confirm("Xóa xe này?")) {
                await fetch(getUrl(`users/${user}/cars/${id}`), { method: 'DELETE' });
                location.reload();
            }
        }
    </script>
</body>
</html>
