<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YourCarManagement - List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .navbar {
            padding: 0.8rem 0 !important;
        }
        .navbar-brand { font-size: 1.2rem !important; }
        .custom-nav .nav-link:hover {
            color: #ffc107 !important;
            transform: translateY(-1px);
        }
        .custom-nav i {
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .container {
                padding-left: 15px !important;
                padding-right: 15px !important;
            }
            .content-wrapper .d-flex {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 12px;
            }

            .content-wrapper h4 {
                font-size: 18px !important;
                margin-bottom: 0 !important;
            }

            .content-wrapper .btn-primary {
                width: 100%;
                padding: 10px !important;
                font-size: 14px;
            }

            .custom-nav {
                width: 100%;
                padding-top: 10px;
            }

            .custom-nav .nav-item {
                width: 100%;
                text-align: left;
            }

            .custom-nav .nav-link {
                padding: 10px 15px !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .custom-nav .nav-item:last-child .nav-link {
                border-bottom: none;
            }

            .custom-nav .btn-outline-light {
                width: 100%;
                margin-top: 10px !important;
                padding: 10px !important;
                border-radius: 8px !important;
            }

            #car-list .col-md-4, 
            #car-list .col-sm-6,
            #car-list [class*="col-"] {
                width: 100% !important;
                max-width: 100% !important;
            }

            .car-card {
                display: flex;
                flex-direction: column;
                margin-bottom: 16px !important;
                border-radius: 12px !important;
                overflow: hidden;
            }

            .car-card img {
                width: 100% !important;
                height: 180px !important;
                object-fit: cover;
            }

            .car-card-body {
                padding: 15px !important;
            }

            .car-actions {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }

            .car-actions .btn {
                flex: 1;
                padding: 8px !important;
                font-size: 13px !important;
            }

            .modal-dialog {
                margin: 15px;
            }
            
            .modal-content {
                border-radius: 12px;
            }
            
            footer p {
                font-size: 12px;
            }
        }
</style>
</head>
<body onload="loadCars()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fas fa-car-side me-2"></i>YourCarManagement
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="width: 1.2rem; height: 1.2rem;"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center custom-nav">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="home.html"><i class="fas fa-home me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="list.html"><i class="fas fa-list me-1"></i>Danh sách xe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="chatbot.html">
                            <i class="fas fa-robot me-1"></i>AI Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="faq.html"><i class="fas fa-question-circle me-1"></i>FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="about.html"><i class="fas fa-info-circle me-1"></i>Giới thiệu</a>
                    </li>
                    
                    <li class="nav-item ms-lg-3">
                        <button onclick="handleLogout()" class="btn btn-outline-light btn-sm px-3 mt-2 mt-lg-0" style="border-radius: 20px; font-size: 13px;">
                            <i class="fas fa-sign-out-alt me-1"></i>Thoát
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="content-wrapper container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4><i class="fas fa-list-ul me-2 text-primary"></i>Danh sách xe của tôi</h4>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Thêm xe mới</button>
        </div>

        <div id="car-list" class="row">
            </div>
    </div>
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Thêm xe mới</h5></div>
                <div class="modal-body">
                    <input type="text" id="b" class="form-control mb-2" placeholder="Hãng xe (Vd: Honda)">
                    <input type="text" id="n" class="form-control mb-2" placeholder="Tên xe (Vd: SH)">
                    <input type="text" id="p" class="form-control mb-2" placeholder="Biển số">
                    <input type="number" id="k" class="form-control mb-2" placeholder="Số KM (ODO)">
                </div>
                <div class="modal-footer">
                    <button onclick="addCar()" class="btn btn-primary w-100">Đồng bộ lên Cloud</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 <strong>YourCarManagement</strong>. Toàn bộ dữ liệu được đồng bộ Cloud.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const user = checkAuth();
        async function addCar() {
            const car = { brand: document.getElementById('b').value, name: document.getElementById('n').value, plate: document.getElementById('p').value, km: document.getElementById('k').value };
            await fetch(getUrl(`users/${user}/cars`), { method: 'POST', body: JSON.stringify(car) });
            location.reload();
        }
        async function loadCars() {
            const res = await fetch(getUrl(`users/${user}/cars`));
            const data = await res.json();
            const list = document.getElementById('car-list');
            if(!data) return list.innerHTML = "<p class='text-center text-muted'>Empty...</p>";
            Object.entries(data).forEach(([id, c]) => {
                list.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="fw-bold text-primary">${c.brand} ${c.name}</h6>
                                <p class="small mb-1">Biển: ${c.plate} | KM: ${c.km}</p>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-danger py-0" onclick="del('${id}')">Xóa</button>
                                    <a href="editor.html?id=${id}" class="btn btn-sm btn-outline-warning py-0">Sửa</a>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }
        async function del(id) {
            if(confirm("Xóa?")) {
                await fetch(getUrl(`users/${user}/cars/${id}`), { method: 'DELETE' });
                location.reload();
            }
        }
    </script>
</body>
</html>
