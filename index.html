<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - YourCarManagement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #0d6efd; --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .auth-card { width: 400px; background: #fff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; border: none; }
        .auth-header { background: var(--primary-color); padding: 40px 20px; text-align: center; color: white; }
        .auth-header h3 { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; margin-bottom: 5px; }
        .auth-header p { font-size: 13px; opacity: 0.8; margin-bottom: 0; }
        .auth-body { padding: 40px 35px; }
        .form-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #6c757d; margin-bottom: 8px; }
        .form-control { border-radius: 12px; padding: 12px 15px; font-size: 14px; border: 1.5px solid #eee; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: none; background: #f8f9ff; }
        .btn-auth { border-radius: 12px; padding: 13px; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; transition: 0.3s; border: none; }
        .btn-primary { background: var(--primary-color); box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4); }
        .toggle-link { font-size: 13px; color: var(--primary-color); text-decoration: none; font-weight: 600; cursor: pointer; }
        .hidden { display: none; }
        .input-group-text { background: transparent; border: 1.5px solid #eee; border-right: none; border-radius: 12px 0 0 12px; color: #adb5bd; }
        .form-control.has-icon { border-left: none; border-radius: 0 12px 12px 0; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h3 class="mb-1"><i class="fas fa-car-side me-2"></i>YourCarManagement</h3>
            <p>Hệ thống quản lý phương tiện thông minh</p>
        </div>
        
        <div class="auth-body">
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập (Email)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" id="l-user" class="form-control has-icon" placeholder="name@gmail.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group position-relative">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="l-pass" class="form-control has-icon pe-5" placeholder="••••••••" required>
                        <span onclick="togglePassword('l-pass', 'toggle-icon-login')" 
                              class="position-absolute top-50 end-0 translate-middle-y pe-3" 
                              style="cursor: pointer; z-index: 10; color: #6c757d;">
                            <i id="toggle-icon-login" class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-auth mb-4">ĐĂNG NHẬP</button>
                <div class="text-center">
                    <span class="text-muted small">Chưa có tài khoản?</span> 
                    <a class="toggle-link" onclick="toggleForm()">Đăng ký ngay</a>
                </div>
            </form>

            <form id="signup-form" class="hidden">
                <div class="mb-3">
                    <label class="form-label">Tạo tên đăng nhập (Email)</label>
                    <input type="text" id="s-user" class="form-control" placeholder="Nhập email của bạn..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <div class="position-relative">
                        <input type="password" id="s-pass" class="form-control pe-5" placeholder="Tối thiểu 6 ký tự" required>
                        <span onclick="togglePassword('s-pass', 'toggle-icon-spass')" 
                              class="position-absolute top-50 end-0 translate-middle-y pe-3" 
                              style="cursor: pointer; z-index: 10; color: #6c757d;">
                            <i id="toggle-icon-spass" class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <div class="position-relative">
                        <input type="password" id="s-confirm" class="form-control pe-5" placeholder="Nhập lại mật khẩu" required>
                        <span onclick="togglePassword('s-confirm', 'toggle-icon-sconfirm')" 
                              class="position-absolute top-50 end-0 translate-middle-y pe-3" 
                              style="cursor: pointer; z-index: 10; color: #6c757d;">
                            <i id="toggle-icon-sconfirm" class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-auth mb-4 shadow-sm" style="background-color: #28a745;">TẠO TÀI KHOẢN</button>
                <div class="text-center">
                    <span class="text-muted small">Đã có tài khoản?</span> 
                    <a class="toggle-link" onclick="toggleForm()">Quay lại Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // --- HÀM THÊM MỚI: XỬ LÝ ẨN/HIỆN MẬT KHẨU ---
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);

            if (passwordInput && toggleIcon) {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.classList.remove("fa-eye");
                    toggleIcon.classList.add("fa-eye-slash"); // Đổi thành mắt gạch chéo
                } else {
                    passwordInput.type = "password";
                    toggleIcon.classList.remove("fa-eye-slash");
                    toggleIcon.classList.add("fa-eye"); // Quay về mắt mở bình thường
                }
            }
        }

        // Hàm làm sạch Email trước khi đưa vào đường dẫn Firebase
        function encodeEmail(email) {
            return email.toLowerCase().replace(/\./g, '_').replace(/@/g, '_');
        }

        // Chuyển đổi qua lại giữa Đăng nhập & Đăng ký
        function toggleForm() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            loginForm.classList.toggle('hidden');
            signupForm.classList.toggle('hidden');
            
            const title = document.querySelector('title');
            title.innerText = signupForm.classList.contains('hidden') ? 'Đăng nhập - YourCarManagement' : 'Đăng ký - YourCarManagement';
        }

        // Xử lý Đăng nhập
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const rawUser = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-pass').value.trim();
            
            const u = encodeEmail(rawUser);

            try {
                const res = await fetch(getUrl(`accounts/${u}`));
                const data = await res.json();

                if (data && data.password === p) {
                    sessionStorage.setItem('logged_in_user', u);
                    window.location.href = 'home.html';
                } else {
                    alert("Thông tin đăng nhập không chính xác.");
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối máy chủ hoặc lỗi cấu hình bảo mật. Vui lòng thử lại.");
            }
        };

        // Xử lý Đăng ký
        document.getElementById('signup-form').onsubmit = async (e) => {
            e.preventDefault();
            const rawUser = document.getElementById('s-user').value.trim();
            const p = document.getElementById('s-pass').value.trim();
            const cf = document.getElementById('s-confirm').value.trim();

            if (p !== cf) return alert("Mật khẩu xác nhận không khớp.");
            if (p.length < 6) return alert("Mật khẩu phải có ít nhất 6 ký tự.");

            const u = encodeEmail(rawUser);

            try {
                const check = await fetch(getUrl(`accounts/${u}`));
                const exists = await check.json();

                if (exists) return alert("Tên đăng nhập này đã được sử dụng.");

                await fetch(getUrl(`accounts/${u}`), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: p, createdAt: new Date() })
                });

                alert("Tạo tài khoản thành công! Bạn có thể đăng nhập ngay bây giờ.");
                toggleForm();
            } catch (err) {
                console.error(err);
                alert("Không thể tạo tài khoản. Vui lòng thử lại sau.");
            }
        };
    </script>
</body>
</html>
