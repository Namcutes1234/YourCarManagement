<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourCarManagement - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0d6efd 0%, #00d2ff 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .login-card { 
            border: none; 
            border-radius: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            background: #ffffff;
            padding: 40px !important;
            width: 100%;
            max-width: 480px;
            transition: all 0.3s ease;
        }
        .login-card h2 { 
            white-space: nowrap; 
            letter-spacing: -1px; 
            color: #0d6efd;
            font-weight: 800;
        }
        .form-control {
            background-color: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 15px;
            transition: all 0.2s;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }
        .btn-auth { 
            border-radius: 12px; 
            padding: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            transition: all 0.3s;
            width: 100%;
            border: none;
        }
        .btn-signin { background: linear-gradient(to right, #0d6efd, #0099ff); color: white; }
        .btn-signup { background: linear-gradient(to right, #2ecc71, #27ae60); color: white; }
        .btn-auth:hover { transform: translateY(-2px); opacity: 0.9; }
        .toggle-link { cursor: pointer; color: #0d6efd; font-weight: 600; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card">
            <div class="text-center mb-4">
                <h2 class="mb-1"><i class="fas fa-car-side me-2"></i>YourCarManagement</h2>
                <p class="text-muted small" id="form-subtitle">Hệ thống quản lý xe chuyên nghiệp</p>
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tên đăng nhập</label>
                    <input type="text" id="login-user" class="form-control" placeholder="Nhập username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-auth btn-signin mb-3 shadow">Đăng Nhập</button>
                <p class="text-center small">Chưa có tài khoản? <span class="toggle-link" onclick="toggleForm('signup')">Đăng ký ngay</span></p>
            </form>

            <form id="signup-form" class="hidden">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tạo Username</label>
                    <input type="text" id="reg-user" class="form-control" placeholder="Ví dụ: Phuong263" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" id="reg-pass" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-auth btn-signup mb-3 shadow">Tạo Tài Khoản</button>
                <p class="text-center small">Đã có tài khoản? <span class="toggle-link" onclick="toggleForm('login')">Quay lại Đăng nhập</span></p>
            </form>
        </div>
    </div>
    <script>
        function toggleForm(type) {
            const loginF = document.getElementById('login-form');
            const signupF = document.getElementById('signup-form');
            const subtitle = document.getElementById('form-subtitle');
            if (type === 'signup') {
                loginF.classList.add('hidden');
                signupF.classList.remove('hidden');
                subtitle.innerText = "Tham gia YourCarManagement ngay";
            } else {
                signupF.classList.add('hidden');
                loginF.classList.remove('hidden');
                subtitle.innerText = "Hệ thống quản lý xe chuyên nghiệp";
            }
        }
        document.getElementById('signup-form').onsubmit = function(e) {
            e.preventDefault();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-confirm').value;
            if (pass.length < 6) return alert("Mật khẩu phải từ 6 ký tự!");
            if (pass !== confirm) return alert("Mật khẩu xác nhận không khớp!");
            if (localStorage.getItem(`user_${user}`)) return alert("Tên đăng nhập đã tồn tại!");

            localStorage.setItem(`user_${user}`, pass);
            alert("Đăng ký thành công! Giờ hãy đăng nhập nhé.");
            toggleForm('login');
        };
        document.getElementById('login-form').onsubmit = function(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;
            const storedPass = localStorage.getItem(`user_${user}`);
            if (storedPass && storedPass === pass) {
                sessionStorage.setItem('logged_in_user', user);
                window.location.href = "home.html";
            } else {
                alert("Tên đăng nhập hoặc mật khẩu không đúng!");
            }
        };
    </script>
</body>
</html>
